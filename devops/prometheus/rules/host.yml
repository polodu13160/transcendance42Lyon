groups:
  - name: Host
    rules:
      - alert: TargetDown
        expr: up{job="node_exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is unreachable !"

      - alert: HostHighCpu
        expr: 100 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU at {{ $value }}% on {{ $labels.instance }}"

      - alert: HostHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage at {{ $value }}%"

      - alert: HostDiskSpaceLow
        expr: 100 - ((node_filesystem_avail_bytes{mountpoint=~"/etc/hosts"} * 100) / node_filesystem_size_bytes{mountpoint=~"/etc/hosts"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Only {{ $value }}% free on {{ $labels.mountpoint }}"