groups:
  - name: Backend
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend is unreachable"

      - alert: HightErrorRate
        expr: sum(rate(http_requests_total{status="5xx"}[5m])) / sum(rate(http_requests_total[5m])) * 100 > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Too many request with status 5xx"

      - alert: HighLantency
        expr: histogram_quantile(0.95, sum by (le, handler) (rate(http_request_duration_seconds_bucket{handler!="/metrics"}[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency on requests duration"