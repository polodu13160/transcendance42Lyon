[package]
name = "backend_blockchain"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.54", features = ["full"] }
tokio-stream = "0.1.19"
dotenvy = "0.15.7"
alloy = { version = "2.5.0", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
