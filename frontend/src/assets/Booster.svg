<svg xmlns="http://www.w3.org/2000/svg" width="300" height="444" viewBox="0 0 300 444" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">MyGatchaGames — booster édition premium</title>
  <desc id="desc">Sachet foil violet aux détails lavande et dorés.</desc>
  <defs>
    <linearGradient id="body" x1="37" y1="30" x2="263" y2="421" gradientUnits="userSpaceOnUse"><stop stop-color="#8B5CF6"/><stop offset=".44" stop-color="#5B21B6"/><stop offset="1" stop-color="#2E1065"/></linearGradient>
    <linearGradient id="seal" x1="43" y1="0" x2="257" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#A78BFA"/><stop offset=".5" stop-color="#F5F3FF"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <linearGradient id="band" x1="61" y1="0" x2="239" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#FDE68A"/><stop offset=".5" stop-color="#FFF7CC"/><stop offset="1" stop-color="#FDE68A"/></linearGradient>
    <path id="tooth" d="M0 0h12l-6-6Z"/>
  </defs>

  <!-- Independent groups make CSS opening animations straightforward. -->
  <g id="booster-pack">
    <path id="pouch" d="M34 25Q34 16 43 16h214q9 0 9 9v394q0 9-9 9H43q-9 0-9-9Z" fill="url(#body)" stroke="#1E0A4A" stroke-width="4"/>
    <path id="foil-frame" d="M42 34Q42 26 50 26h200q8 0 8 8v376q0 8-8 8H50q-8 0-8-8Z" stroke="#DDD6FE" stroke-width="2"/>

    <g id="top-seal" fill="#A78BFA"><use href="#tooth" x="42" y="16"/><use href="#tooth" x="54" y="16"/><use href="#tooth" x="66" y="16"/><use href="#tooth" x="78" y="16"/><use href="#tooth" x="90" y="16"/><use href="#tooth" x="102" y="16"/><use href="#tooth" x="114" y="16"/><use href="#tooth" x="126" y="16"/><use href="#tooth" x="138" y="16"/><use href="#tooth" x="150" y="16"/><use href="#tooth" x="162" y="16"/><use href="#tooth" x="174" y="16"/><use href="#tooth" x="186" y="16"/><use href="#tooth" x="198" y="16"/><use href="#tooth" x="210" y="16"/><use href="#tooth" x="222" y="16"/><use href="#tooth" x="234" y="16"/><use href="#tooth" x="246" y="16"/></g>
    <g id="bottom-seal" fill="#7C3AED" transform="translate(0 444) scale(1 -1)"><use href="#tooth" x="42" y="16"/><use href="#tooth" x="54" y="16"/><use href="#tooth" x="66" y="16"/><use href="#tooth" x="78" y="16"/><use href="#tooth" x="90" y="16"/><use href="#tooth" x="102" y="16"/><use href="#tooth" x="114" y="16"/><use href="#tooth" x="126" y="16"/><use href="#tooth" x="138" y="16"/><use href="#tooth" x="150" y="16"/><use href="#tooth" x="162" y="16"/><use href="#tooth" x="174" y="16"/><use href="#tooth" x="186" y="16"/><use href="#tooth" x="198" y="16"/><use href="#tooth" x="210" y="16"/><use href="#tooth" x="222" y="16"/><use href="#tooth" x="234" y="16"/><use href="#tooth" x="246" y="16"/></g>
    <path d="M43 44h214M43 400h214" stroke="url(#seal)" stroke-width="2"/>

    <g id="tcg-label"><rect x="121" y="67" width="58" height="26" rx="13" fill="#321075" stroke="#C4B5FD"/><text x="150" y="84" fill="#F5F3FF" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="2.2">TCG</text></g>
    <path d="M61 111h178" stroke="#A78BFA" stroke-width="1"/><path d="M61 315h178" stroke="#A78BFA" stroke-width="1"/>

    <!-- The original MyGatchaGames card mark, in a high-contrast crest. -->
    <g id="brand-crest" transform="translate(69 126)">
      <circle cx="81" cy="86" r="79" fill="#4C1D95" stroke="#C4B5FD" stroke-width="2"/>
      <rect x="40" y="31" width="78" height="102" rx="15" fill="#A78BFA" transform="rotate(11 79 82)"/>
      <rect x="34" y="28" width="78" height="102" rx="15" fill="#8B5CF6" transform="rotate(-8 73 79)"/>
      <rect x="43" y="29" width="78" height="102" rx="15" fill="#6D28D9" stroke="#F5F3FF" stroke-width="3"/>
      <rect x="51" y="37" width="62" height="86" rx="10" stroke="#DDD6FE" stroke-width="2"/>
      <path d="m82 47 7 18 19 1-15 12 5 19-16-10-16 10 5-19-15-12 19-1Z" fill="#FDE68A"/>
      <circle cx="64" cy="105" r="3.5" fill="#EDE9FE"/><circle cx="101" cy="105" r="3.5" fill="#EDE9FE"/>
    </g>

    <g id="wordmark" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,Arial,sans-serif"><text x="150" y="350" fill="#fff" font-size="23" font-weight="800" letter-spacing="-1">MyGatcha</text><text x="150" y="372" fill="#D8CCFF" font-size="19" font-weight="800" letter-spacing="-.7">Games</text></g>
    <path id="gold-band" d="M61 385h178" stroke="url(#band)" stroke-width="2"/>
    <g id="sparkles" fill="#FDE68A"><path d="m57 210 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/><path d="m243 210 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/></g>
  </g>
