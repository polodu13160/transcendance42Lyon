    <text x="459" y="99" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="55" font-weight="800" letter-spacing="-2.8" fill="#7C3AED">Games</text>
