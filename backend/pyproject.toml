[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "polodu13160", email = "paul.depetrini@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "cookiecutter>=2.7.1",
    "fastapi[standard]>=0.141.1",
    "psycopg2-binary>=2.9.13",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
    entrypoint = "src.main:app"
